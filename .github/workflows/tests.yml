name: Tests

# Runs on every push and PR. This is the control that stops the v4 failure mode:
# a CHANGELOG claiming fixes ("re-verified in a Node harness", "unit-tested against
# the adversarial fixture") that were never actually applied to the shipped code.
# If a fix regresses, this goes red before the claim reaches a client report.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip          # requirements.txt exists, so this has a key to hash

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      # fetch_tri.py imports playwright at module scope, so importing it for tests
      # needs the pip package present. Install the package ONLY — deliberately not
      # `playwright install chromium`, which downloads a ~150MB browser this job
      # never launches (the timeout tests use fakes). The scheduled fetch job does
      # install the browser, because it actually drives one.
      #
      # tests/test_fetch_tri.py also stubs playwright when it's absent, so the suite
      # still runs for a contributor who hasn't installed anything. Installing it
      # here anyway means CI exercises the real import path the fetcher uses, rather
      # than only ever testing against the stub.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Syntax gates: cheap, and they catch a broken paste of index.html before
      # anything else runs.
      - name: Syntax check fetch_tri.py
        run: python -m py_compile fetch_tri.py

      - name: Syntax check index.html JavaScript
        run: |
          python - <<'EOF'
          import re, pathlib, subprocess, sys, tempfile
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not blocks:
              sys.exit("no inline <script> block found in index.html")
          with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as fh:
              fh.write("\n".join(blocks))
              tmp = fh.name
          subprocess.run(["node", "--check", tmp], check=True)
          print(f"node --check passed ({len(blocks)} script block(s))")
          EOF

      - name: Python regression tests
        run: python tests/test_fetch_tri.py

      - name: JavaScript regression tests
        run: node tests/test_app.js

      - name: Scheme matching / category / benchmark tests
        run: node tests/test_matching.js

      # Insights tab: name normalisation against real AMFI string variants,
      # candidate eligibility, the thin-cohort caveat on the peer list, and the
      # period-table rendering (including that Return -- not the annualised rate --
      # is the cell coloured against the category average; they are the only two
      # columns in the same units).
      - name: Insights tab tests
        run: node tests/test_insights.js

      # probe_ranks.py re-implements index.html's universe filters in Python.
      # This asserts the two copies still agree; edit one list without the other
      # and this goes red rather than silently shrinking the ranking universe.
      # The report suite drives the REAL exportReport() in a VM and reads the
      # workbook back with the same xlsx-js-style build index.html loads from the
      # CDN, so it needs that package present. tests/test_report.js SKIPs cleanly
      # when it is absent — but a test that silently skips in CI proves nothing, so
      # it is installed here and genuinely runs. --no-save keeps the repo free of a
      # package.json it does not otherwise need.
      - name: Install the Excel library the report test reads with
        run: npm install --no-save --no-audit --no-fund xlsx-js-style@1.2.0

      # Excel report: sheet set and naming per sub-tab, pooled rows matching the
      # Portfolio pane, per-sheet KPI blocks reconciling against independently
      # computed totals, and the Insights sheets carrying the same facts the pane
      # renders. Runs against the committed data/tri and data/ranks files.
      - name: Excel report tests
        run: node tests/test_report.js

      - name: Probe filter drift guard
        run: python tests/test_probe_ranks.py

      # The ranking maths: weekly grid spacing, horizon eligibility, rank/quartile
      # assignment, and the publish gate that refuses to overwrite good data with
      # a collapsed fetch.
      - name: Ranking computation tests
        run: python tests/test_fetch_ranks.py

      # Scheme-continuation chains. Also the drift guard: index.html carries its own
      # copy of the map (it cannot import Python), so this suite parses index.html at
      # runtime and fails if the two ever disagree — the same protection
      # mf_universe.py gives the category filters. A chain applied by one side and
      # not the other means Portfolio and Insights report different histories for
      # the same fund.
      - name: Merger chain and JS/Python drift guard
        run: python tests/test_mergers.py

      - name: Syntax check ranking scripts
        run: python -m py_compile mf_universe.py probe_ranks.py fetch_ranks.py