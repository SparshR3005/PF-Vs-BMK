name: Fetch ranking data

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC Mon-Fri = 03:30 IST Tue-Sat.
    #
    # This USED to be 15:30 UTC (21:00 IST), which made every published grid one
    # full trading day stale. mfapi.in refreshes 6x daily — 10:05, 14:05, 18:05,
    # 21:05, 03:09 and 05:05 IST — while SEBI gives AMCs until 23:00 IST to upload
    # a day's NAV to AMFI. A 21:00 IST run therefore read mfapi's 18:05 snapshot,
    # taken five hours before the AMCs had even filed: Monday's run ranked funds on
    # Friday's NAV.
    #
    # 03:30 IST sits after the 03:09 pass, which is the first one to carry the
    # previous trading day. Tue-Sat covers Mon-Fri: a trading day D publishes by
    # 23:00 on D, so the D+1 early-morning run is the first that can see it.
    # Sunday and Monday 03:30 IST are skipped because Saturday and Sunday produce
    # no NAV.
    #
    # Scheduled workflows are queued, not guaranteed — 5-30 min of drift is normal.
    # The 21-minute gap to the 03:09 pass is deliberate slack, and drift only ever
    # makes this MORE correct, since later is fresher.
    #
    # Still nowhere near the TRI job (14:30 UTC), so the two never contend for a
    # runner window and a failure in one is unambiguous.
    - cron: "0 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ranks-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Measured: 2.42 schemes/sec at concurrency 8. Discovery touches ~2,890 schemes
    # via /latest and full history is pulled for ~1,250 rankable funds, so the happy
    # path is roughly 30 min. A timeout commits nothing, so leave real headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      # Gate. The publish rules and the shared universe filters are the only things
      # standing between a bad fetch and a category file full of wrong ranks. If the
      # tests don't pass, don't fetch and don't commit: a skipped day costs nothing.
      - name: Regression tests (gate)
        run: |
          python tests/test_probe_ranks.py
          python tests/test_fetch_ranks.py

      - name: Fetch ranking data
        run: python fetch_ranks.py --concurrency 8

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranks
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update ranking data [skip ci]"
            git push || (git pull --rebase --autostash && git push)
          fi
