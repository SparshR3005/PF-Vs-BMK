name: Fetch ranking data

on:
  workflow_dispatch:
  schedule:
    # 15:30 UTC = 21:00 IST, an hour after the TRI job, so the two never contend
    # for the same runner window and a failure in one is unambiguous.
    - cron: "30 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ranks-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Measured: 2.42 schemes/sec at concurrency 8. Discovery touches ~2,890 schemes
    # via /latest and full history is pulled for ~1,250 rankable funds, so the happy
    # path is roughly 30 min. A timeout commits nothing, so leave real headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      # Gate. The publish rules and the shared universe filters are the only things
      # standing between a bad fetch and a category file full of wrong ranks. If the
      # tests don't pass, don't fetch and don't commit: a skipped day costs nothing.
      - name: Regression tests (gate)
        run: |
          python tests/test_probe_ranks.py
          python tests/test_fetch_ranks.py
          python tests/test_mergers.py

      # continue-on-error is LOAD-BEARING, not laziness.
      #
      # fetch_ranks.py deliberately writes every file it can and THEN returns 1 --
      # on a refused publish gate (v13 #5) or a per-category exception. Its own
      # comment says "everything that could be written already has been by this
      # point, so failing here costs no data". That was FALSE as wired: a failing
      # step aborts the job, so "Commit updated data" never ran and every category
      # that published successfully was thrown away with the runner.
      #
      # It also latched. safe_to_publish() compares against the COMMITTED count, so
      # with nothing committed the count never updated, the refusal reproduced the
      # next night, and ALL ELEVEN categories stopped updating -- not just the one
      # that was refused. Reachable without anything exotic: get_json() drops a fund
      # after 3 failed retries, so a partial mfapi wobble during discovery shrinks a
      # cohort past the 80% / 3-fund gate.
      #
      # tri-fetch.yml already has the right shape and says why: its --audit step runs
      # AFTER the commit, because "failing earlier would mean one wedged index blocks
      # the 38 healthy ones". This is the same trade on the ranks side.
      #
      # NOTE the gate above is deliberately NOT continue-on-error: a red test suite
      # must still stop the fetch and the commit. Only the fetch itself is allowed to
      # fail soft, and the final step below re-raises it.
      - name: Fetch ranking data
        id: fetch
        continue-on-error: true
        run: python fetch_ranks.py --concurrency 8

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranks
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update ranking data [skip ci]"
            git push || (git pull --rebase --autostash && git push)
          fi

      # Re-raise the fetch's exit code now that whatever DID publish is safely
      # committed. A refusal repeats every night until someone looks, which is the
      # point -- but it must be visible without also costing a day of good data.
      - name: Fail if the fetch refused a publish or errored a category
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "fetch_ranks.py exited non-zero: a category errored, or a publish gate"
          echo "refused. Anything publishable was still committed by the step above."
          echo "Read the fetch log, then re-run with --force ONLY after confirming"
          echo "the drop is real."
          exit 1